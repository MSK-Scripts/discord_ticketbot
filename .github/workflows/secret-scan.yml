name: Secret Scanning (TruffleHog)

# Scans for accidentally committed secrets such as the Discord bot TOKEN,
# CLIENT_ID, MSK_API_KEY or any other credentials from the .env file.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  trufflehog:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          # Exclude the Postgres/MySQL detectors: the only DB connection strings
          # in this repo are documentation placeholders (e.g.
          # postgres://user:pass@host:5432/db) in .env.example, the READMEs and
          # source comments. Real database credentials only ever live in the
          # gitignored .env, never committed — so these detectors produce nothing
          # but false positives here. All other detectors (Discord TOKEN,
          # MSK_API_KEY, generic high-entropy secrets, …) stay fully active.
          extra_args: --results=verified,unknown --exclude-detectors=postgres,mysql
